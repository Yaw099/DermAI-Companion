{% extends "base.html" %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h2 class="auth-title">Sign in</h2>
        <p class="auth-subtitle">
            Log in to securely access your skin journal and AI assistant.
        </p>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="demo@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="password123"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary">Continue</button>
        </form>

        {% if error %}
        <p class="form-error">{{ error }}</p>
        {% endif %}

        <p class="auth-footnote">
            Demo only – do not enter real medical information or passwords.
        </p>
    </div>
</div>
{% endblock %}
